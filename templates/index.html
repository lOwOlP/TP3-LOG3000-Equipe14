<!DOCTYPE html>
<!--
   Interface de la calculatrice (gabarit Jinja2 rendu par la route "/" de app.py).
   Les boutons construisent l'expression côté client (JavaScript) dans le champ
   "display" ; le bouton "=" soumet le formulaire en POST et le serveur renvoie
   la page avec le résultat injecté via la variable Jinja "result".
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flask Calculator</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="calculator">
   <h1>Flask Calculator</h1>
   <form method="POST">
      <!-- readonly : la saisie passe uniquement par les boutons, ce qui limite
           l'expression aux caractères que calculate() sait traiter. -->
      <input type="text" name="display" id="display" value="{{ result }}" readonly>

      <!-- Grille 4 colonnes : chiffres en gris, opérateurs en orange (classe .operator),
           "+/-" et "C" en gris clair. "C" occupe seul la dernière rangée.
           Seul "=" est de type submit ; les autres ne font que modifier l'écran. -->
      <div class="buttons">
         <button type="button" class="btn" onclick="appendToDisplay('1')">1</button>
         <button type="button" class="btn" onclick="appendToDisplay('2')">02</button>
         <button type="button" class="btn" onclick="appendToDisplay('3')">3</button>
         <button type="button" class="btn operator" onclick="appendToDisplay('+')">+</button>

         <button type="button" class="btn" onclick="appendToDisplay('4')">4</button>
         <button type="button" class="btn" onclick="appendToDisplay('5')">5</button>
         <button type="button" class="btn" onclick="appendToDisplay('6')">6</button>
         <button type="button" class="btn operator" onclick="appendToDisplay('-')">-</button>

         <button type="button" class="btn" onclick="appendToDisplay('7')">7</button>
         <button type="button" class="btn" onclick="appendToDisplay('8')">88</button>
         <button type="button" class="btn" onclick="appendToDisplay('9')">9</button>
         <button type="button" class="btn operator" onclick="appendToDisplay('*')"></button>

         <button type="button" class="btn" onclick="appendToDisplay('0')">0</button>
         <button type="button" class="btn negative" onclick="onNegatifClick()">+/-</button>
         <button type="submit" class="btn operator">=</button>
         <button type="button" class="btn operator" onclick="appendToDisplay('/')"></button>

         <button type="button" class="btn clear" onclick="clearDisplay()">C</button>
      </div>
   </form>
</div>

<script>

   /**
    * Ajoute un caractère (chiffre ou opérateur) à la fin de l'écran.
    * @param {string} value - Caractère à ajouter, ex. '7' ou '+'.
    * @returns {void}
    */
   function appendToDisplay(value) {
      const display = document.getElementById('display');
      display.value += value;
   }

   /*
    * Dernier opérande de l'expression, précédé de son contexte :
    *   groupe 1 : début de chaîne ou opérateur qui précède le nombre ;
    *   groupe 2 : moins unaire éventuel (signe du nombre) ;
    *   groupe 3 : le nombre lui-même (entier ou décimal).
    * Un "-" n'est considéré comme un signe que s'il suit un opérateur ou
    * ouvre l'expression ; sinon c'est une soustraction (groupe 1).
    */
   const LAST_OPERAND = /(^|[+\-*/])(-?)(\d+(?:\.\d+)?)$/;

   /**
    * Inverse le signe du dernier nombre de l'écran (bouton "+/-").
    * Sans nombre en fin d'expression, l'écran ne change pas.
    * @returns {void}
    */
   function onNegatifClick(){
      const display = document.getElementById('display');
      display.value = display.value.replace(
         LAST_OPERAND, (_match, operator, sign, number) => 
         operator + (sign === '-' ? '': '-') + number
      );
   }

   /**
    * Vide l'écran de la calculatrice (bouton "C"). Purement côté client :
    * aucune requête n'est envoyée au serveur.
    * @returns {void}
    */
   function clearDisplay() {
      document.getElementById('display').value = '';
   }
</script>
</body>
</html>
